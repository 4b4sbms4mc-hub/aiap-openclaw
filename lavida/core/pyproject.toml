[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiap-core-service"
version = "0.2.3"
description = "Local AIAP Core service and storage"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.26.0", "rfc3339-validator==0.1.4", "cryptography>=46.0.5"]

[project.optional-dependencies]
system-embedding = ["pyobjc-framework-NaturalLanguage>=10; sys_platform == 'darwin'"]

[tool.setuptools]
include-package-data = false
packages = ["aiap_core", "aiap_core.profile"]
package-dir = {"aiap_core.profile" = "profile"}

[tool.setuptools.package-data]
"aiap_core.profile" = ["*.json", "**/*.json"]

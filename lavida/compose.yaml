name: aiap-mvp
services:
  core:
    build: ./core
    image: aiap-mvp-core-service:0.2.0
    restart: unless-stopped
    command: [serve, --host, 0.0.0.0, --port, "8042", --archive-interval, "0"]
    ports:
      - "127.0.0.1:8043:8042"
    volumes:
      - core-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      default:
        aliases: [aiap-mvp-core]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8042/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  default:
    name: aiap-mvp-local
    internal: true
volumes:
  core-data:

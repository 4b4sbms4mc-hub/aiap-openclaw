name: AIAP Memory MCP

on:
  pull_request:
    paths:
      - 'aiap-core/**'
      - 'lavida/core/**'
      - '.github/workflows/aiap-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'aiap-core/**'
      - 'lavida/core/**'
      - '.github/workflows/aiap-mcp.yml'

permissions:
  contents: read

jobs:
  installed-mcp:
    name: Installed MCP on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Core and MCP
        run: python -m pip install ./lavida/core "./aiap-core[mcp]"
      - name: Verify deployment and owner approval
        run: python -m unittest discover -s aiap-core/tests -p test_memory_mcp.py -v

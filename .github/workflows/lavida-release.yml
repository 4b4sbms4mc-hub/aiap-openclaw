# SPDX-License-Identifier: Apache-2.0
name: La Vida validation and release
on:
  pull_request:
    paths: ["lavida/**", "scripts/**", ".github/workflows/lavida-release.yml"]
  push:
    branches: [main]
    paths: ["lavida/**", "scripts/**", ".github/workflows/lavida-release.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new prerelease tag after validation (existing tags are never overwritten)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lavida-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.1"
      - name: Install Python dependencies
        run: python -m pip install -r lavida/core/requirements.txt
      - name: Core tests (66)
        working-directory: lavida/core
        run: python -m unittest discover -s tests -v
      - name: Experimental recovery governance tests (74)
        run: python -m unittest discover -s scripts/tests -v
      - name: Plugin HTTP integration (15)
        working-directory: lavida
        env:
          PYTHONPATH: core
        run: node plugin-tests/integration.mjs
      - name: Automatic-candidate regression (15)
        working-directory: lavida
        env:
          PYTHONPATH: core
        run: node plugin-tests/automatic.mjs
      - name: Install pinned real OpenClaw in temporary runtime
        run: npm install --prefix "$RUNNER_TEMP/aiap-openclaw-host" --ignore-scripts --no-audit --no-fund openclaw@2026.9.4
      - name: Package source and verify real Gateway fresh install and isolated restore
        run: |
          python scripts/package_lavida.py
          python scripts/check_openclaw_gateway.py --openclaw-entry "$RUNNER_TEMP/aiap-openclaw-host/node_modules/openclaw/openclaw.mjs" --output .validation/gateway.json
      - uses: actions/upload-artifact@v4
        with:
          name: lavida-gateway-acceptance
          path: .validation/gateway.json
      - name: Build isolated Docker fixture with real OpenClaw
        run: docker build -f scripts/Dockerfile.gateway-acceptance -t aiap-gateway-acceptance .
      - name: Verify fresh Gateway and restored tool calls inside Docker without external network
        run: |
          docker create --name aiap-gateway-acceptance --network none --read-only --tmpfs /tmp:rw,nosuid,mode=1777,size=256m --tmpfs /home/node/.cache:rw,nosuid,uid=1000,gid=1000,mode=700,size=128m --tmpfs /reports:rw,nosuid,mode=1777,size=8m --cap-drop ALL --security-opt no-new-privileges --env GITHUB_SHA="$GITHUB_SHA" aiap-gateway-acceptance
          docker start -a aiap-gateway-acceptance
          test "$(docker inspect --format '{{.State.ExitCode}}' aiap-gateway-acceptance)" = 0
      - name: Remove synthetic Gateway container and image
        if: always()
        run: |
          docker rm -f aiap-gateway-acceptance || true
          docker image rm aiap-gateway-acceptance || true
      - name: Build and initialize fresh Core Docker fixture
        run: |
          docker compose -f lavida/compose.yaml build
          docker compose -f lavida/compose.yaml run --rm core init
          docker compose -f lavida/compose.yaml up -d
      - name: Verify fresh approval/recall and restart persistence
        run: python scripts/check_fresh_core.py
      - name: Remove synthetic CI containers and volume
        if: always()
        run: docker compose -f lavida/compose.yaml down -v
  release:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lavida-gateway-acceptance
          path: .validation
      - name: Package validated source
        run: python scripts/package_lavida.py --ci --gateway-report .validation/gateway.json
      - name: Publish prerelease with verified download assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_lavida_release.py

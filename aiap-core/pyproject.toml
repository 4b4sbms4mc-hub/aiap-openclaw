[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiap-reference"
version = "0.3.5"
description = "Reference implementation for AI Avatar Protocol v0.3"
authors = [{name = "Wang Lu"}]
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.22",
  "cryptography>=42",
  "jcs>=0.2.1"
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2.3,<3", "pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
aiap = "aiap.cli:main"

[tool.setuptools]
packages = ["aiap", "aiap.schemas"]
package-dir = {"" = "src", "aiap.schemas" = "schemas"}

[tool.setuptools.package-data]
"aiap.schemas" = ["*.schema.json"]

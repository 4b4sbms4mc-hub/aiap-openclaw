[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiap-reference"
version = "0.3.0"
description = "Reference implementation for AI Avatar Protocol v0.3"
authors = [{name = "Wang Lu"}]
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.22",
  "cryptography>=42",
  "jcs>=0.2.1"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aiap = "aiap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
